<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Построение трубопровода (Three.js)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f5f6fa; font-family: sans-serif; }
        #hint {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 25, 45, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 8px; font-size: 14px; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="hint">🔧 Поверните кольцами и потяните за стрелку. <b>Enter</b> — создать узел | <b>Esc</b> — завершить</div>

    <script type="module">
        import * as THREE from 'https://esm.sh';
        import { OrbitControls } from 'https://esm.sh/examples/jsm/controls/OrbitControls.js';
        import { TransformControls } from 'https://esm.sh/examples/jsm/controls/TransformControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f6fa);
        scene.add(new THREE.GridHelper(20, 20, 0xcccccc, 0xe0e0e0));

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x888899, 1.2));

        const nodeMat = new THREE.MeshBasicMaterial({ color: 0x00cc44 });
        const pipeMat = new THREE.MeshBasicMaterial({ color: 0x0f1379 });

        let currentStartNode = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 24), nodeMat);
        scene.add(currentStartNode);

        const tempNode = new THREE.Mesh(
            new THREE.BoxGeometry(0.28, 0.28, 0.28),
            new THREE.MeshBasicMaterial({ color: 0xff2222 })
        );
        tempNode.position.set(2, 0, 0);
        scene.add(tempNode);

        let tempPipe = null;
        function updatePipe() {
            if (tempPipe) {
                scene.remove(tempPipe);
                tempPipe.geometry.dispose();
                tempPipe = null;
            }
            const dist = currentStartNode.position.distanceTo(tempNode.position);
            if (dist < 0.01) return;

            const path = new THREE.LineCurve3(currentStartNode.position.clone(), tempNode.position.clone());
            tempPipe = new THREE.Mesh(new THREE.TubeGeometry(path, 20, 0.07, 12, false), pipeMat);
            scene.add(tempPipe);
            document.getElementById('hint').innerHTML = `🔧 Длина: <b>${dist.toFixed(2)} м</b> | <b>Enter</b> — создать узел | <b>Esc</b> — выход`;
        }
        updatePipe();

        const moveControls = new TransformControls(camera, renderer.domElement);
        moveControls.setMode('translate');
        moveControls.setSpace('local');
        moveControls.attach(tempNode);
        scene.add(moveControls.getHelper ? moveControls.getHelper() : moveControls);

        const rotateControls = new TransformControls(camera, renderer.domElement);
        rotateControls.setMode('rotate');
        rotateControls.setSpace('local');
        rotateControls.attach(tempNode);
        scene.add(rotateControls.getHelper ? rotateControls.getHelper() : rotateControls);

        const onDrag = (e) => { controls.enabled = !e.value; };
        moveControls.addEventListener('dragging-changed', onDrag);
        rotateControls.addEventListener('dragging-changed', onDrag);
        moveControls.addEventListener('objectChange', updatePipe);
        rotateControls.addEventListener('objectChange', updatePipe);

        let isBuilding = true;
        window.addEventListener('keydown', (e) => {
            if (!isBuilding) return;

            if (e.key === 'Enter') {
                e.preventDefault();
                if (currentStartNode.position.distanceTo(tempNode.position) < 0.01) return;

                const newNode = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 24), nodeMat);
                newNode.position.copy(tempNode.position);
                scene.add(newNode);

                tempPipe = null;
                currentStartNode = newNode;
                document.getElementById('hint').innerHTML = `✅ Узел создан! Поверните оси и тяните за стрелку. <b>Enter</b> — далее | <b>Esc</b> — выход`;
            } else if (e.key === 'Escape') {
                isBuilding = false;
                if (tempPipe) scene.remove(tempPipe);
                scene.remove(tempNode);
                moveControls.detach();
                rotateControls.detach();
                document.getElementById('hint').innerHTML = `🏁 Построение завершено`;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
