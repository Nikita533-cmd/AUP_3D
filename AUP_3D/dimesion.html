<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Three.js CAD Размер трубопровода</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1e1e24; font-family: sans-serif; }
    #info {
      position: absolute; top: 15px; left: 15px; color: #fff;
      background: rgba(0, 0, 0, 0.7); padding: 12px 16px; border-radius: 8px;
      pointer-events: none; user-select: none; line-height: 1.5; z-index: 10;
    }
    #status {
      position: absolute; bottom: 15px; left: 15px; color: #ffcc00;
      background: rgba(0, 0, 0, 0.85); padding: 10px 15px; border-radius: 6px;
      font-family: monospace; z-index: 20;
    }
    .dim-input {
      background: #2b2b36;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      font-weight: bold;
      width: 65px;
      text-align: center;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .dim-input:focus {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>Инструкция:</b><br>
    1. Кликните по первому узлу (красная сфера)<br>
    2. Кликните по второму узлу, чтобы поставить размер<br>
    3. Измените цифру в поле и нажмите <b>Enter</b>
  </div>
  <div id="status">Загрузка 3D-движка...</div>

  <script>
    const statusBox = document.getElementById('status');
    window.addEventListener('error', (e) => {
      statusBox.style.color = '#ff6b6b';
      statusBox.textContent = 'Ошибка: ' + e.message;
    });
    if (window.location.protocol === 'file:') {
      statusBox.style.color = '#ff6b6b';
      statusBox.innerHTML = 'Файл открыт напрямую (file://). Запустите его через локальный сервер (например, Live Server в VS Code).';
    }
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com';
    import { OrbitControls } from 'https://unpkg.com';
    import { CSS2DRenderer, CSS2DObject } from 'https://unpkg.com';

    document.getElementById('status').style.display = 'none';

    class DimensionLine extends THREE.Group {
      constructor(p1, p2, offset = 1.2, onLengthChange = null) {
        super();
        this.p1 = p1.clone();
        this.p2 = p2.clone();
        this.offset = offset;
        this.onLengthChange = onLengthChange;

        this.color = 0x00ffcc;
        this.material = new THREE.LineBasicMaterial({ color: this.color });
        this.arrowMaterial = new THREE.MeshBasicMaterial({ color: this.color });

        this.extLine1 = new THREE.Line(new THREE.BufferGeometry(), this.material);
        this.extLine2 = new THREE.Line(new THREE.BufferGeometry(), this.material);
        this.mainLine = new THREE.Line(new THREE.BufferGeometry(), this.material);

        const arrowGeo = new THREE.ConeGeometry(0.08, 0.25, 12);
        this.arrow1 = new THREE.Mesh(arrowGeo, this.arrowMaterial);
        this.arrow2 = new THREE.Mesh(arrowGeo, this.arrowMaterial);

        this.input = document.createElement('input');
        this.input.type = 'number';
        this.input.step = '0.1';
        this.input.className = 'dim-input';

        this.input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const newLen = parseFloat(this.input.value);
            if (!isNaN(newLen) && newLen > 0.2 && this.onLengthChange) {
              this.onLengthChange(newLen);
            }
            this.input.blur();
          }
        });
        this.input.addEventListener('pointerdown', (e) => e.stopPropagation());

        this.label = new CSS2DObject(this.input);

        this.add(this.extLine1, this.extLine2, this.mainLine, this.arrow1, this.arrow2, this.label);
        this.update(this.p1, this.p2);
      }

      update(p1, p2) {
        this.p1.copy(p1);
        this.p2.copy(p2);

        const dir = new THREE.Vector3().subVectors(this.p2, this.p1);
        const length = dir.length();
        const dirNorm = dir.clone().normalize();

        let up = new THREE.Vector3(0, 1, 0);
        if (Math.abs(dirNorm.dot(up)) > 0.99) {
          up.set(1, 0, 0);
        }
        const side = new THREE.Vector3().crossVectors(dirNorm, up).normalize();
        const offsetDir = new THREE.Vector3().crossVectors(side, dirNorm).normalize();

        const offsetVec = offsetDir.clone().multiplyScalar(this.offset);
        const extExtra = offsetDir.clone().multiplyScalar(this.offset + 0.2);

        const d1 = this.p1.clone().add(offsetVec);
        const d2 = this.p2.clone().add(offsetVec);

        this.extLine1.geometry.setFromPoints([this.p1, this.p1.clone().add(extExtra)]);
        this.extLine2.geometry.setFromPoints([this.p2, this.p2.clone().add(extExtra)]);
        this.mainLine.geometry.setFromPoints([d1, d2]);

        const arrowOffset = dirNorm.clone().multiplyScalar(0.125);
        this.arrow1.position.copy(d1).add(arrowOffset);
        this.arrow1.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm.clone().negate());

        this.arrow2.position.copy(d2).sub(arrowOffset);
        this.arrow2.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm);

        const midPoint = new THREE.Vector3().addVectors(d1, d2).multiplyScalar(0.5);
        this.label.position.copy(midPoint);

        if (document.activeElement !== this.input) {
          this.input.value = length.toFixed(2);
        }
      }

      dispose() {
        this.remove(this.label);
        if (this.input.parentNode) {
          this.input.parentNode.removeChild(this.input);
        }
      }
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e24);
    scene.add(new THREE.GridHelper(20, 20, 0x444455, 0x2c2c38));

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(5, 10, 7);
    scene.add(light, new THREE.AmbientLight(0xffffff, 0.6));

    const pos1 = new THREE.Vector3(-3, 1, 0);
    const pos2 = new THREE.Vector3(3, 1, 0);

    const nodeGeo = new THREE.SphereGeometry(0.35, 32, 32);
    const node1 = new THREE.Mesh(nodeGeo, new THREE.MeshStandardMaterial({ color: 0xff5555 }));
    const node2 = new THREE.Mesh(nodeGeo, new THREE.MeshStandardMaterial({ color: 0xff5555 }));
    node1.position.copy(pos1);
    node2.position.copy(pos2);
    scene.add(node1, node2);

    const pipeMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.5, roughness: 0.3 });
    const pipeMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1, 24), pipeMat);
    scene.add(pipeMesh);

    function updatePipeGeometry() {
      const dir = new THREE.Vector3().subVectors(node2.position, node1.position);
      const len = dir.length();
      pipeMesh.scale.set(1, len, 1);
      pipeMesh.position.copy(node1.position).add(node2.position).multiplyScalar(0.5);
      pipeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    }
    updatePipeGeometry();

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const nodes = [node1, node2];
    let selectedNodes = [];
    let currentDimension = null;

    window.addEventListener('pointerdown', (event) => {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(nodes);

      if (intersects.length > 0) {
        const clickedNode = intersects[0].object;

        if (!selectedNodes.includes(clickedNode)) {
          selectedNodes.push(clickedNode);
          clickedNode.material.color.setHex(0x00ffcc);
        }

        if (selectedNodes.length === 2) {
          if (currentDimension) {
            currentDimension.dispose();
            scene.remove(currentDimension);
          }

          const [first, second] = selectedNodes;

          currentDimension = new DimensionLine(first.position, second.position, 1.2, (newLength) => {
            const dir = new THREE.Vector3().subVectors(second.position, first.position).normalize();
            second.position.copy(first.position).add(dir.multiplyScalar(newLength));

            updatePipeGeometry();
            currentDimension.update(first.position, second.position);
          });

          scene.add(currentDimension);

          selectedNodes.forEach(n => n.material.color.setHex(0xff5555));
          selectedNodes = [];
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
