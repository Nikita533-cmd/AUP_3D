<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Polyline Builder с измерением</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f5f5f5; font-family: Arial, sans-serif; }
        canvas { display: block; }
        
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            min-width: 250px;
        }
        
        #distance-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: none;
            border: 3px solid #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }
        #distance-indicator.active { display: block; }
        
        .btn {
            padding: 10px 16px;
            margin: 4px 2px;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        
        .btn-mode {
            background: #333;
            color: white;
        }
        .btn-mode.active {
            background: #1976d2;
            border-color: #1976d2;
        }
        
        .btn-apply {
            background: #2a7a3e;
            color: white;
            border-color: #2a7a3e;
            width: 48%;
        }
        .btn-apply:hover { background: #3a9a4e; }
        
        .btn-cancel {
            background: #d32f2f;
            color: white;
            border-color: #d32f2f;
            width: 48%;
        }
        .btn-cancel:hover { background: #e34f3f; }
        
        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #555;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="ui-panel">
        <b>🔧 Построение трубопровода</b>
        
        <div style="margin-top:10px;">
            <button class="btn btn-mode active" id="btnTranslate">↔ Перемещение (W)</button>
            <button class="btn btn-mode" id="btnRotate">↻ Поворот (E)</button>
        </div>
        
        <!-- ✅ НОВЫЕ КНОПКИ: ПРИМЕНИТЬ И ОТМЕНИТЬ -->
        <div class="btn-row">
            <button class="btn btn-apply" id="btnApply">✓ Применить (Enter)</button>
            <button class="btn btn-cancel" id="btnCancel">✗ Отменить (Esc)</button>
        </div>
        
        <div class="stats">
            Точек создано: <span id="pointCount">0</span><br>
            Последняя линия: <span id="lastLength">0.00</span> м<br>
            Общая длина: <span id="totalLength">0.00</span> м
        </div>
    </div>

    <!-- Индикатор расстояния -->
    <div id="distance-indicator">
        📏 Расстояние: <span id="distanceValue">0.00</span> м
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // ============================================================
        // 1. СЦЕНА И КАМЕРА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        scene.add(new THREE.GridHelper(20, 20, 0x888888, 0xcccccc));
        scene.add(new THREE.AxesHelper(5));

        // ============================================================
        // 2. МАНИПУЛЯТОР
        // ============================================================
        const manipulator = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        manipulator.position.set(0, 0, 0);
        scene.add(manipulator);

        // ============================================================
        // 3. TransformControls
        // ============================================================
        const transformControls = new TransformControls(camera, renderer.domElement);
        scene.add(transformControls);
        transformControls.attach(manipulator);
        transformControls.setMode('translate');
        transformControls.setSize(2);

        // ============================================================
        // 4. ЛИНИЯ-ПОДСКАЗКА
        // ============================================================
        const previewLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, 0)
            ]),
            new THREE.LineDashedMaterial({
                color: 0xffff00,
                dashSize: 0.3,
                gapSize: 0.15,
                linewidth: 2
            })
        );
        previewLine.computeLineDistances();
        scene.add(previewLine);

        // ============================================================
        // 5. ДАННЫЕ ПОСТРОЕНИЯ
        // ============================================================
        const points = [];
        const pointMarkers = [];
        const lines = [];
        let totalLength = 0;

        // ✅ startPoint — это ПОСЛЕДНЯЯ созданная точка (от неё считаем расстояние)
        let startPoint = new THREE.Vector3(0, 0, 0);

        // ============================================================
        // 6. ИЗМЕРЕНИЕ РАССТОЯНИЯ
        // ============================================================
        const distanceIndicator = document.getElementById('distance-indicator');
        const distanceValue = document.getElementById('distanceValue');

        function updateDistance() {
            const currentPos = manipulator.position.clone();
            const distance = startPoint.distanceTo(currentPos);
            
            distanceValue.textContent = distance.toFixed(2);
            distanceIndicator.classList.add('active');
            
            // Обновляем линию-подсказку от startPoint до текущей позиции
            previewLine.geometry.setFromPoints([startPoint, currentPos]);
            previewLine.computeLineDistances();
        }

        transformControls.addEventListener('objectChange', updateDistance);

        transformControls.addEventListener('dragging-changed', (event) => {
            orbit.enabled = !event.value;
            if (!event.value) {
                // После отпускания оставляем индикатор видимым
                // (он скроется только при нажатии Apply/Cancel)
            }
        });

        // ============================================================
        // 7. ФУНКЦИЯ ПРИМЕНИТЬ (создать точку)
        // ============================================================
        function applyPoint() {
            const pos = manipulator.position.clone();
            points.push(pos);
            
            // Создаём визуальный маркер точки
            const marker = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x0000ff })
            );
            marker.position.copy(pos);
            scene.add(marker);
            pointMarkers.push(marker);
            
            // Если есть предыдущая точка — создаём линию
            if (points.length > 1) {
                const prevPos = points[points.length - 2];
                const line = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([prevPos, pos]),
                    new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 })
                );
                scene.add(line);
                lines.push(line);
                
                const segLength = prevPos.distanceTo(pos);
                totalLength += segLength;
                document.getElementById('lastLength').textContent = segLength.toFixed(2);
                document.getElementById('totalLength').textContent = totalLength.toFixed(2);
                
                console.log(`✅ Создана линия: ${segLength.toFixed(2)} м`);
            }
            
            // ✅ ВАЖНО: Манипулятор ОСТАЁТСЯ на последней точке
            // (не сбрасываем в 0,0,0)
            // startPoint обновляем на текущую позицию
            startPoint.copy(pos);
            
            document.getElementById('pointCount').textContent = points.length;
            
            // Скрываем индикатор расстояния (расстояние = 0)
            distanceIndicator.classList.remove('active');
            
            console.log(`✅ Точка ${points.length} создана в (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})`);
        }

        // ============================================================
        // 8. ФУНКЦИЯ ОТМЕНИТЬ (удалить последнюю точку)
        // ============================================================
        function cancelPoint() {
            if (points.length === 0) {
                console.log('⚠️ Нечего отменять');
                return;
            }
            
            // Удаляем последнюю точку
            points.pop();
            
            // Удаляем последний маркер
            if (pointMarkers.length > 0) {
                const lastMarker = pointMarkers.pop();
                scene.remove(lastMarker);
            }
            
            // Удаляем последнюю линию
            if (lines.length > 0) {
                const lastLine = lines.pop();
                scene.remove(lastLine);
                
                // Пересчитываем общую длину
                totalLength = 0;
                for (let i = 1; i < points.length; i++) {
                    totalLength += points[i-1].distanceTo(points[i]);
                }
            }
            
            // ✅ Перемещаем манипулятор на последнюю оставшуюся точку
            if (points.length > 0) {
                const lastPos = points[points.length - 1];
                manipulator.position.copy(lastPos);
                startPoint.copy(lastPos);
            } else {
                // Если точек не осталось — возвращаем в начало
                manipulator.position.set(0, 0, 0);
                startPoint.set(0, 0, 0);
            }
            
            document.getElementById('pointCount').textContent = points.length;
            document.getElementById('lastLength').textContent = points.length > 1 
                ? points[points.length-1].distanceTo(points[points.length-2]).toFixed(2) 
                : "0.00";
            document.getElementById('totalLength').textContent = totalLength.toFixed(2);
            
            distanceIndicator.classList.remove('active');
            
            console.log(`❌ Последняя точка отменена. Осталось: ${points.length}`);
        }

        // ============================================================
        // 9. ПРИВЯЗКА КНОПОК И КЛАВИШ
        // ============================================================
        document.getElementById('btnApply').addEventListener('click', applyPoint);
        document.getElementById('btnCancel').addEventListener('click', cancelPoint);

        const btnTranslate = document.getElementById('btnTranslate');
        const btnRotate = document.getElementById('btnRotate');

        btnTranslate.addEventListener('click', () => {
            transformControls.setMode('translate');
            btnTranslate.classList.add('active');
            btnRotate.classList.remove('active');
        });

        btnRotate.addEventListener('click', () => {
            transformControls.setMode('rotate');
            btnRotate.classList.add('active');
            btnTranslate.classList.remove('active');
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') btnTranslate.click();
            if (e.key.toLowerCase() === 'e') btnRotate.click();
            if (e.code === 'Enter') applyPoint();
            if (e.code === 'Escape') cancelPoint();
        });

        // ============================================================
        // 10. РЕСАЙЗ И АНИМАЦИЯ
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        console.log("✅ Запущено! Манипулятор остаётся на последней точке после Enter.");
    </script>
</body>
</html>
